specVersion: "3.2"
metadata:
  name: com.imported.neptune_flight
type: application
framework:
  name: OpenUI5
  version: "1.148.3"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        transformTypeScript: true
        omitTSFromBuildResult: true
        omitSourceMaps: true
        transformModulesToUI5:
          overridesToOverride: true
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        debug: true
        transformTypeScript: true
        transformModulesToUI5:
          overridesToOverride: true
